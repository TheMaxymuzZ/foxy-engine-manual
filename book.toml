[book]
title = "Manual de Foxy Engine"
description = "Guía de usuario y referencia de Foxy Engine, el motor de juegos de bloques para Mac, Windows y Linux."
authors = ["Andrés (TheMaxymuzZ)"]
language = "es"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/foxy.css", "theme/iconos.css"]
additional-js = ["theme/version.js", "theme/version-pagina.js"]
no-section-label = true
git-repository-url = "https://github.com/TheMaxymuzZ/foxy-engine-manual"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/TheMaxymuzZ/foxy-engine-manual/edit/main/{path}"
site-url = "/foxy-engine-manual/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2

[output.html.print]
enable = true
